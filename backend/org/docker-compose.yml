version: '3.8'

services:
  org-backend:
    image: cgr.dev/chainguard/go:latest
    container_name: org-backend
    ports:
      - "8085:8085"
    working_dir: /app
    volumes:
      - .:/app
    command: ["run", "main.go"]
    restart: always
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - PORT=${PORT:-8085}

