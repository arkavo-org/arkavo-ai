version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
      - ./html:/usr/share/nginx/html
    ports:
      - "80:80"
      - "443:443"
    networks:
      - backend-network

  backend:
    image: your-backend-image
    container_name: backend
    networks:
      - backend-network

  another-backend:
    image: another-backend-image
    container_name: another-backend
    networks:
      - backend-network

  sub-backend:
    image: your-sub-backend-image
    container_name: sub-backend
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge

