services:
  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
      - ./html:/usr/share/nginx/html
      - /etc/letsencrypt/live/arkavo.org/fullchain.pem:/keys/fullchain.pem
      - /etc/letsencrypt/live/arkavo.org/privkey.pem:/keys/privkey.pem
    ports:
      - "80:80"
      - "443:443"

