events {}

http {
    server {
        listen 80;
        server_name arkavo.org *.arkavo.org;

        # Redirect all HTTP traffic to HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name arkavo.org;

        # SSL Certificate Files
        ssl_certificate /etc/nginx/ssl/live/arkavo.org/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/arkavo.org/privkey.pem;

        # Proxy to backend services
        location / {
            proxy_pass http://backend:8080; # Replace with OpenTDF or other main service
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api {
            proxy_pass http://another-backend:3001; # Replace with API backend
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    server {
        listen 443 ssl;
        server_name sub.arkavo.org;

        # SSL Certificate Files (shared wildcard cert)
        ssl_certificate /etc/nginx/ssl/live/arkavo.org/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/arkavo.org/privkey.pem;

        # Proxy to a subdomain-specific backend
        location / {
            proxy_pass http://sub-backend:3002; # Replace with your subdomain service
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}

